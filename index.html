/* EÜR & USt EXPORT */
function exportEUER(year){
  const list=state.transactions.filter(t=>t.date.startsWith(String(year)));
  const income=list.filter(t=>t.type==='income');
  const expense=list.filter(t=>t.type==='expense');
  const incomeByCat=groupByCategory(income);
  const expenseByCat=groupByCategory(expense);
  const totalIn=sumNet(income);const totalEx=sumNet(expense);
  const profit=round2(totalIn-totalEx);
  const ust=calcVatBalance(list);
  const rows=[];
  rows.push(['EÜR-Auswertung '+year]);
  rows.push(['Erstellt am',new Date().toLocaleString('de-DE')]);
  rows.push(['Unternehmen',state.settings.businessName||state.settings.ownerName]);
  rows.push(['Steuernummer',state.settings.taxNumber||'']);
  rows.push([]);
  rows.push(['BETRIEBSEINNAHMEN (netto)']);
  rows.push(['Kategorie','Netto in €']);
  Object.entries(incomeByCat).sort((a,b)=>b[1]-a[1]).forEach(([cat,amt])=>rows.push([cat,toCsvNum(amt)]));
  rows.push(['Summe Einnahmen',toCsvNum(totalIn)]);
  rows.push([]);
  rows.push(['BETRIEBSAUSGABEN (netto)']);
  rows.push(['Kategorie','Netto in €']);
  Object.entries(expenseByCat).sort((a,b)=>b[1]-a[1]).forEach(([cat,amt])=>rows.push([cat,toCsvNum(amt)]));
  rows.push(['Summe Ausgaben',toCsvNum(totalEx)]);
  rows.push([]);
  rows.push(['ERGEBNIS']);
  rows.push(['Gewinn / Verlust (vor Steuern)',toCsvNum(profit)]);
  if(!state.settings.kleinunternehmer){
    rows.push([]);
    rows.push(['UMSATZSTEUER '+year]);
    rows.push(['Vereinnahmte USt',toCsvNum(ust.collected)]);
    rows.push(['Gezahlte Vorsteuer',toCsvNum(ust.paid)]);
    rows.push(['Zahllast / Erstattung',toCsvNum(ust.balance)]);
  }
  const csv=rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
  download(`euer_${year}.csv`,'\uFEFF'+csv,'text/csv;charset=utf-8');
}

function exportUstVoranmeldung(year){
  const cycle=state.settings.vatCycle;
  const periods=[];
  if(cycle==='monthly'){
    for(let m=0;m<12;m++)periods.push({key:`${year}-${String(m+1).padStart(2,'0')}`,label:`${monthName(m)} ${year}`,filter:t=>parseInt(t.date.slice(5,7),10)-1===m});
  } else {
    for(let q=1;q<=4;q++)periods.push({key:`${year}-Q${q}`,label:`Q${q} ${year}`,filter:t=>quarterOf(t.date)===q});
  }
  const yearTx=state.transactions.filter(t=>t.date.startsWith(String(year)));
  const rows=[];
  rows.push(['Umsatzsteuer-Voranmeldungen '+year]);
  rows.push(['Erstellt am',new Date().toLocaleString('de-DE')]);
  rows.push(['Zyklus',cycle==='monthly'?'Monatlich':'Quartalsweise']);
  rows.push(['Steuernummer',state.settings.taxNumber||'']);
  rows.push(['USt-IdNr.',state.settings.vatId||'']);
  rows.push([]);
  rows.push(['Zeitraum','Bemessungsgrundlage 19% (netto)','USt 19%','Bemessungsgrundlage 7% (netto)','USt 7%','Steuerfreie Umsätze (0%)','Innergem. sonstige Leistungen Kz 21 (netto)','USt gesamt','Vorsteuer 19%','Vorsteuer 7%','Vorsteuer gesamt','Zahllast / Erstattung','Abgabefrist']);

  // Hilfsfunktion: gibt das Breakdown einer Transaktion zurück (immer als Array, auch bei Single-USt)
  const tBreakdown=t=>{
    if(Array.isArray(t.vatBreakdown)&&t.vatBreakdown.length){
      return t.vatBreakdown.map(b=>({rate:b.rate,net:b.net,vat:b.vat}));
    }
    return [{rate:t.vatRate||0,net:t.net||0,vat:t.vat||0}];
  };
  // Summiert nettos je USt-Satz für eine Liste von Transaktionen
  const sumByRate=(list,rate)=>{
    return round2(list.reduce((s,t)=>s+tBreakdown(t).filter(b=>b.rate===rate).reduce((s2,b)=>s2+b.net,0),0));
  };
  const sumVatByRate=(list,rate)=>{
    return round2(list.reduce((s,t)=>s+tBreakdown(t).filter(b=>b.rate===rate).reduce((s2,b)=>s2+b.vat,0),0));
  };

  let totalCollected=0,totalPaid=0;
  periods.forEach(p=>{
    const pTx=yearTx.filter(p.filter);
    const inc=pTx.filter(t=>t.type==='income');
    const exp=pTx.filter(t=>t.type==='expense');
    const base19=sumByRate(inc,19);
    const vat19=sumVatByRate(inc,19);
    const base7=sumByRate(inc,7);
    const vat7=sumVatByRate(inc,7);
    const base0=sumByRate(inc,0);
    // Reverse-Charge: Bezahlte Rechnungen mit reverseCharge==true, deren Bezahldatum im Zeitraum liegt
    const rcInvoices=state.invoices.filter(invX=>{
      if(!invX.reverseCharge||invX.status!=='paid')return false;
      // Verknüpfte Einnahme finden, deren Datum prüfen
      if(invX.txId){
        const tx=state.transactions.find(t=>t.id===invX.txId);
        return tx && tx.date.startsWith(String(year)) && p.filter(tx);
      }
      // Fallback: Rechnungsdatum
      const d=invX.invoiceDate||'';
      if(!d.startsWith(String(year)))return false;
      return p.filter({date:d});
    });
    const baseRC=round2(rcInvoices.reduce((s,i)=>s+(i.totalNet||i.totalGross||0),0));
    const collected=round2(vat19+vat7);
    const paid19=sumVatByRate(exp,19);
    const paid7=sumVatByRate(exp,7);
    const paid=round2(paid19+paid7);
    const balance=round2(collected-paid);
    totalCollected=round2(totalCollected+collected);
    totalPaid=round2(totalPaid+paid);
    let due='';
    if(cycle==='monthly'){
      const m=parseInt(p.key.slice(5,7),10);const dy=m===12?year+1:year;const dm=m===12?1:m+1;
      due=`10.${String(dm).padStart(2,'0')}.${dy}`;
    } else {
      const q=parseInt(p.key.slice(-1));const dueMonths={1:[4,year],2:[7,year],3:[10,year],4:[1,year+1]};
      due=`10.${String(dueMonths[q][0]).padStart(2,'0')}.${dueMonths[q][1]}`;
    }
    rows.push([p.label,toCsvNum(base19),toCsvNum(vat19),toCsvNum(base7),toCsvNum(vat7),toCsvNum(base0),toCsvNum(baseRC),toCsvNum(collected),toCsvNum(paid19),toCsvNum(paid7),toCsvNum(paid),toCsvNum(balance),due]);
  });
  rows.push([]);
  rows.push(['Jahressumme','','','','','','',toCsvNum(totalCollected),'','',toCsvNum(totalPaid),toCsvNum(totalCollected-totalPaid),'']);
  rows.push([]);
  rows.push(['Hinweis: Diese Werte sind als Ausgangsmaterial für die ELSTER-Voranmeldung gedacht.']);
  rows.push(['Sie ersetzen NICHT die Einreichung über ELSTER. Reverse-Charge-Umsätze müssen zusätzlich in der Zusammenfassenden Meldung (ZM) ans BZSt gemeldet werden.']);
  const csv=rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
  download(`ust_voranmeldung_${year}.csv`,'\uFEFF'+csv,'text/csv;charset=utf-8');
}

function sumNet(l){return round2(l.reduce((s,t)=>s+(t.net||0),0));}
function sumGross(l){return round2(l.reduce((s,t)=>s+(t.gross||0),0));}
function calcVatBalance(l){const c=round2(l.filter(t=>t.type==='income').reduce((s,t)=>s+(t.vat||0),0));const p=round2(l.filter(t=>t.type==='expense').reduce((s,t)=>s+(t.vat||0),0));return{collected:c,paid:p,balance:round2(c-p)};}
function groupByCategory(l){return l.reduce((a,t)=>{a[t.category]=round2((a[t.category]||0)+(t.net||0));return a;},{});}
function availableYears(){
  const current=new Date().getFullYear();
  const y=new Set();
  for(let year=2021;year<=current;year++) y.add(year);
  state.transactions.forEach(t=>y.add(parseInt(t.date.slice(0,4))));
  state.invoices.forEach(i=>y.add(parseInt((i.invoiceDate||todayISO()).slice(0,4))));
  return[...y].sort((a,b)=>b-a);
}
function defaultDateForEntry(){
  const cy=new Date().getFullYear();
  if(state.year===cy) return todayISO();
  // Rückwirkend: 1. Januar des gewählten Jahres als Start; Nutzer kann im Datum-Feld anpassen
  return `${state.year}-01-01`;
}

function calcVendorStats(vendorId, year){
  const v=state.vendors.find(x=>x.id===vendorId);
  if(!v||v.productVendorId==null)return null;
  let grossSales=0, vendorShare=0, commission=0, orderCount=0;
  const yr=String(year);
  state.transactions.forEach(t=>{
    if(t.type!=='income')return;
    if(!t.date.startsWith(yr))return;
    (t.wooVendors||[]).forEach(wv=>{
      if(wv.vendor_id!==v.productVendorId)return;
      grossSales+=(wv.line_total_net||0)+(wv.line_total_tax||0);
      const pluginPct=wv.items?.[0]?.commission_pct||0;
      const pluginComm=wv.commission||0;
      let effShare, effComm;
      if(pluginPct>0||pluginComm>0){ effShare=wv.vendor_share; effComm=pluginComm; }
      else if(v.commissionPct>0){ effComm=(wv.line_total_net||0)*v.commissionPct/100; effShare=(wv.line_total_net||0)-effComm; }
      else { effComm=0; effShare=wv.line_total_net||0; }
      vendorShare+=effShare; commission+=effComm; orderCount++;
    });
  });
  const cnYear=state.creditNotes.filter(c=>c.vendorId===v.id && (c.issueDate||'').startsWith(yr));
  const cnPaid=cnYear.filter(c=>c.status==='paid');
  return {
    grossSales:round2(grossSales),
    vendorShare:round2(vendorShare),
    commission:round2(commission),
    orderCount,
    cnCount:cnYear.length,
    cnPaidCount:cnPaid.length,
    totalCreditedGross:round2(cnYear.reduce((s,c)=>s+(c.totalGross||0),0)),
    totalPaidGross:round2(cnPaid.reduce((s,c)=>s+(c.totalGross||0),0)),
    openPayoutGross:round2(cnYear.reduce((s,c)=>s+(c.totalGross||0),0)-cnPaid.reduce((s,c)=>s+(c.totalGross||0),0)),
  };
}

// Generiert die nächste Gutschrift-Nummer im Format GS-YYYY-NNNN
function nextCreditNoteNumber(){
  const year=new Date().getFullYear();
  const existing=state.creditNotes.filter(c=>c.number&&c.number.startsWith(`GS-${year}-`));
  const maxNum=existing.reduce((max,c)=>{
    const match=(c.number||'').match(/GS-\d{4}-(\d+)/);
    return match?Math.max(max,parseInt(match[1],10)):max;
  },0);
  return `GS-${year}-${String(maxNum+1).padStart(4,'0')}`;
}

// Findet alle Einnahmen-Transaktionen, die einem Anbieter in einem Zeitraum zugeordnet sind.
// Für die Zuordnung nutzen wir die Product-Vendor-Metadaten in der Transaktion,
// die beim WooCommerce-Import aus dem "vendors"-Array der Bestellung übernommen wurden.
function findVendorEarnings(vendorId, from, to){
  const v=state.vendors.find(x=>x.id===vendorId);
  if(!v)return [];
  const vendorCommissionPct=typeof v.commissionPct==='number'?v.commissionPct:0;
  const lines=[];
  state.transactions.forEach(t=>{
    if(t.type!=='income')return;
    if(t.date<from||t.date>to)return;
    if(!t.wooVendors||!Array.isArray(t.wooVendors))return;
    t.wooVendors.forEach(wv=>{
      if(wv.vendor_id!==v.productVendorId)return;
      // Plattform-Provision ermitteln:
      // 1. Wenn Plugin einen Wert > 0 liefert → verwenden
      // 2. Sonst Hankebuch-Stammdaten-Wert anwenden
      const pluginPct=wv.items?.[0]?.commission_pct||0;
      const pluginCommission=wv.commission||0;
      let effectivePct, effectiveCommission, effectiveShare;
      if(pluginPct>0||pluginCommission>0){
        effectivePct=pluginPct;
        effectiveCommission=pluginCommission;
        effectiveShare=wv.vendor_share;
      } else if(vendorCommissionPct>0){
        // Fallback: Satz aus Anbieter-Stammdaten in Hankebuch
        effectivePct=vendorCommissionPct;
        effectiveCommission=round2(wv.line_total_net*vendorCommissionPct/100);
        effectiveShare=round2(wv.line_total_net-effectiveCommission);
      } else {
        // Keine Provision definiert → 0 % Plattform-Anteil, Anbieter bekommt alles
        effectivePct=0;
        effectiveCommission=0;
        effectiveShare=wv.line_total_net;
      }
      if(effectiveShare<=0)return;
      lines.push({
        txId:t.id,
        date:t.date,
        orderNumber:t.invoiceNumber||t.wooOrderNumber||'',
        description:(t.description||'').replace(/^[^·]*·\s*/,''),
        grossSale:wv.line_total_net+wv.line_total_tax,
        netSale:wv.line_total_net,
        commission:effectiveCommission,
        vendorShare:effectiveShare,
        commissionPct:effectivePct,
      });
    });
  });
  lines.sort((a,b)=>a.date.localeCompare(b.date));
  return lines;
}

          <div>zzgl. USt ${vatRate}%</div>
          <div class="num" style="font-variant-numeric:tabular-nums">+${fmtEUR(vatAmount)}</div>
        `:`
          <div style="font-size:11px;font-style:italic;color:var(--ink-muted)">Gemäß §19 UStG keine Umsatzsteuer</div>
          <div></div>
        `}

        <div class="num" style="font-weight:700;color:var(--green);border-top:1px solid var(--ink);padding-top:4px;font-variant-numeric:tabular-nums">${fmtEUR(payoutGross)}</div>

      <div style="font-size:12px;max-height:240px;overflow:auto">

}

async function saveCreditNoteFromGenerator(){
  const vendorId=document.getElementById('cn-vendor').value;
  const from=document.getElementById('cn-from').value;
  const to=document.getElementById('cn-to').value;
  if(!vendorId||!from||!to)return;
  const v=state.vendors.find(x=>x.id===vendorId);
  if(!v){toast('Anbieter nicht gefunden');return;}
  const lines=findVendorEarnings(vendorId,from,to);
  if(!lines.length){toast('Keine Positionen im Zeitraum');return;}

  const vatRate=v.kleinunternehmer?0:(state.settings.defaultVatRate||19);
  const totalNet=round2(lines.reduce((s,l)=>s+l.vendorShare,0));
  const totalVat=round2(totalNet*vatRate/100);
  const totalGross=round2(totalNet+totalVat);

  const cn={
    id:uid('cn'),
    number:nextCreditNoteNumber(),
    createdAt:new Date().toISOString(),
    vendorId:v.id,
    vendorSnapshot:{
      name:v.name, company:v.company, street:v.street, zip:v.zip, city:v.city, country:v.country,
      email:v.email, phone:v.phone,
      taxNumber:v.taxNumber, vatId:v.vatId,
      iban:v.iban, bic:v.bic, bankName:v.bankName,
      kleinunternehmer:!!v.kleinunternehmer,
      commissionPct:v.commissionPct,
    },
    periodFrom:from,
    periodTo:to,
    issueDate:todayISO(),
    status:'draft', // draft | sent | paid
    paymentDate:null,
    lines:lines,
    vatRate,
    totalNet,
    totalVat,
    totalGross,
    notes:'',
  };
  state.creditNotes.push(cn);
  await saveCreditNotes();
  toast(`Gutschrift ${cn.number} erstellt`);
  closeModal();
  state.view='creditNotes';
  render();
}

async function deleteCreditNote(id){
  const cn=state.creditNotes.find(c=>c.id===id);
  if(!cn)return;
  // Prüfen ob Ausgabe verknüpft ist
  const linkedExpense=state.transactions.find(t=>t.creditNoteId===cn.id);
  let deleteExpense=false;
  if(linkedExpense){
    const msg=`Gutschrift ${cn.number} ist mit einer Ausgabe (${fmtEUR(linkedExpense.gross)} am ${fmtDate(linkedExpense.date)}) verknüpft.\n\nGutschrift UND Ausgabe löschen? Wenn du "Abbrechen" wählst, wird nichts gelöscht.`;
    if(!confirm(msg))return;
    deleteExpense=true;
  } else {
    if(!confirm(`Gutschrift ${cn.number} wirklich löschen?`))return;
  }
  state.creditNotes=state.creditNotes.filter(c=>c.id!==id);
  if(deleteExpense && linkedExpense){
    state.transactions=state.transactions.filter(t=>t.id!==linkedExpense.id);
    await saveTransactions();
  }
  await saveCreditNotes();
  toast(deleteExpense?'Gutschrift und Ausgabe gelöscht':'Gutschrift gelöscht');
  closeModal();render();
}

async function markCreditNotePaid(id){
  const cn=state.creditNotes.find(c=>c.id===id);
  if(!cn)return;
  // Prüfen ob für diese Gutschrift schon eine Ausgabe existiert
  const existingExpense=state.transactions.find(t=>t.creditNoteId===cn.id);
  if(existingExpense){
    // Schon gebucht – nur Status setzen
    cn.status='paid';
    if(!cn.paymentDate)cn.paymentDate=todayISO();
    await saveCreditNotes();
    toast('Als bezahlt markiert (Ausgabe war schon gebucht)');
    closeModal();render();
    return;
  }
  // Dialog öffnen: Soll Ausgabe gebucht werden?
  openCreditNotePaidDialog(cn);
}

function mailCreditNote(id){

  if(!cn)return;
  const v=cn.vendorSnapshot||{};
  if(!v.email){toast('Keine E-Mail-Adresse beim Anbieter hinterlegt');return;}

  const subject=`Gutschrift ${cn.number} von ${state.settings.businessName||'Hankemacht'}`;
  const body=`Hallo ${v.name||''},

anbei erhältst du die Gutschrift ${cn.number} für den Zeitraum ${fmtDate(cn.periodFrom)} bis ${fmtDate(cn.periodTo)}.

Abrechnung:
- Netto-Anteil: ${fmtEUR(cn.totalNet)}
${cn.vatRate>0?`- zzgl. USt ${cn.vatRate}%: ${fmtEUR(cn.totalVat)}\n`:''}- Auszahlungsbetrag: ${fmtEUR(cn.totalGross)}

Die Überweisung erfolgt in Kürze auf das hinterlegte Konto.

Bitte das PDF der Gutschrift als Anhang mitsenden – lade es dafür kurz herunter (Button "PDF anzeigen / drucken" in Hankebuch) und häng es hier an diese Mail an.

Viele Grüße
${state.settings.ownerName||state.settings.businessName||'Hankemacht'}`;

  const mailto=`mailto:${encodeURIComponent(v.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href=mailto;

  }

function renderStats(){
  const yearTx=state.transactions.filter(t=>t.date.startsWith(String(state.year)));
  const income=yearTx.filter(t=>t.type==='income');
  const expense=yearTx.filter(t=>t.type==='expense');
  const incomeTotal=sumNet(income);const expenseTotal=sumNet(expense);
  const profit=incomeTotal-expenseTotal;const ust=calcVatBalance(yearTx);
  const monthly=Array.from({length:12},(_,m)=>{const mTx=yearTx.filter(t=>parseInt(t.date.slice(5,7),10)-1===m);return{m,inc:sumNet(mTx.filter(t=>t.type==='income')),exp:sumNet(mTx.filter(t=>t.type==='expense'))};});
  const maxVal=Math.max(1,...monthly.flatMap(x=>[x.inc,x.exp]));
  const incomeMonths=monthly.filter(m=>m.inc>0);
  const avgIncome=incomeMonths.length?round2(incomeTotal/incomeMonths.length):0;
  const bestMonth=monthly.reduce((b,m)=>m.inc>b.inc?m:b,{m:0,inc:0,exp:0});
  const byContact={};income.forEach(t=>{if(t.contact)byContact[t.contact]=(byContact[t.contact]||0)+t.net;});
  const topContacts=Object.entries(byContact).map(([n,a])=>({name:n,amt:round2(a)})).sort((a,b)=>b.amt-a.amt).slice(0,5);
  const maxContact=topContacts[0]?.amt||1;
  const catsIn=groupByCategory(income);const catsEx=groupByCategory(expense);

  // Anbieter-Performance: Umsatz und Gutschriften pro Anbieter im aktuellen Jahr
  const vendorStats=state.vendors.map(v=>{
    if(v.productVendorId==null)return null;
    // Brutto-Verkäufe aus den Transaktionen
    let grossSales=0, vendorShare=0, commission=0, orderCount=0;
    yearTx.forEach(t=>{
      if(t.type!=='income')return;
      (t.wooVendors||[]).forEach(wv=>{
        if(wv.vendor_id!==v.productVendorId)return;
        grossSales+=(wv.line_total_net||0)+(wv.line_total_tax||0);
        // Provision korrekt ausrechnen (mit Hankebuch-Fallback wie im Generator)
        const pluginPct=wv.items?.[0]?.commission_pct||0;
        const pluginComm=wv.commission||0;
        let effShare, effComm;
        if(pluginPct>0||pluginComm>0){ effShare=wv.vendor_share; effComm=pluginComm; }
        else if(v.commissionPct>0){ effComm=(wv.line_total_net||0)*v.commissionPct/100; effShare=(wv.line_total_net||0)-effComm; }
        else { effComm=0; effShare=wv.line_total_net||0; }
        vendorShare+=effShare; commission+=effComm; orderCount++;
      });
    });
    // Gutschriften des Jahres für diesen Anbieter
    const cnYear=state.creditNotes.filter(c=>c.vendorId===v.id && (c.issueDate||'').startsWith(String(state.year)));
    const cnPaid=cnYear.filter(c=>c.status==='paid');
    const totalCreditedGross=round2(cnYear.reduce((s,c)=>s+(c.totalGross||0),0));
    const totalPaidGross=round2(cnPaid.reduce((s,c)=>s+(c.totalGross||0),0));
    const openPayoutGross=round2(totalCreditedGross-totalPaidGross);
    return {
      vendor:v,
      grossSales:round2(grossSales),
      vendorShare:round2(vendorShare),
      commission:round2(commission),
      orderCount,
      cnCount:cnYear.length,
      cnPaidCount:cnPaid.length,
      totalCreditedGross,
      totalPaidGross,
      openPayoutGross,
    };
  }).filter(Boolean).filter(s=>s.grossSales>0||s.cnCount>0).sort((a,b)=>b.grossSales-a.grossSales);

  const vendorTotalGross=round2(vendorStats.reduce((s,v)=>s+v.grossSales,0));
  const vendorTotalCommission=round2(vendorStats.reduce((s,v)=>s+v.commission,0));
  const vendorTotalOpen=round2(vendorStats.reduce((s,v)=>s+v.openPayoutGross,0));
  const maxVendorSale=vendorStats[0]?.grossSales||1;

  // Reverse-Charge / ZM-Vorbereitung
  const rcInvoices=state.invoices.filter(i=>i.reverseCharge && (i.invoiceDate||'').startsWith(String(state.year)));
  const rcByQuarter={1:[],2:[],3:[],4:[]};
  rcInvoices.forEach(i=>{
    // Datum: bei bezahlten Rechnungen das Zahlungsdatum, sonst das Rechnungsdatum
    let refDate=i.invoiceDate||'';
    if(i.status==='paid'&&i.txId){
      const tx=state.transactions.find(t=>t.id===i.txId);
      if(tx)refDate=tx.date;
    }
    const q=quarterOf(refDate);
    if(q&&rcByQuarter[q])rcByQuarter[q].push({inv:i,refDate});
  });
  // Pro Quartal die USt-IdNrn aggregieren
  const rcQuarterStats=[1,2,3,4].map(q=>{
    const items=rcByQuarter[q];
    if(!items.length)return null;
    const byVatId={};
    items.forEach(({inv})=>{
      const vid=(inv.customer?.vatId||'').replace(/\s/g,'').toUpperCase()||'(ohne USt-IdNr.)';
      const name=inv.customer?.name||'';
      if(!byVatId[vid])byVatId[vid]={vatId:vid,name,total:0,count:0,invoices:[]};
      byVatId[vid].total+=(inv.totalNet||inv.totalGross||0);
      byVatId[vid].count++;
      byVatId[vid].invoices.push(inv.number);
    });
    return {q, items:Object.values(byVatId).map(x=>({...x,total:round2(x.total)})).sort((a,b)=>b.total-a.total), total:round2(items.reduce((s,x)=>s+(x.inv.totalNet||x.inv.totalGross||0),0))};
  }).filter(Boolean);
  return `
    <div class="row" style="margin-bottom:6px">
      <h1 style="font-size:28px;font-style:italic;font-weight:500"><b>Statistik</b> ${state.year}</h1>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-sm" data-action="export-euer">EÜR</button>
        ${!state.settings.kleinunternehmer?`<button class="btn btn-sm" data-action="export-vat">USt-VA</button>`:''}
        <button class="btn btn-sm" data-action="export-csv">${ICON.download} CSV</button>
      </div>
    </div>
    <div style="color:var(--ink-muted);font-size:13px;margin-bottom:20px">Alle Zahlen als Netto, für Steuererklärung und Reflexion.</div>
    <div class="card">
      <div class="section-title">Jahresverlauf</div>
      <div class="stat-legend">
        <span><span class="dot" style="background:var(--green)"></span>Einnahmen</span>
        <span><span class="dot" style="background:var(--terra)"></span>Ausgaben</span>
      </div>
      <div class="stat-bars">
        ${monthly.map(mo=>{const incH=Math.max(0,(mo.inc/maxVal)*140);const expH=Math.max(0,(mo.exp/maxVal)*140);const hd=mo.inc>0||mo.exp>0;
          return `<div class="stat-col" title="${monthName(mo.m)}: +${fmtEUR(mo.inc)} / −${fmtEUR(mo.exp)}">
            <div class="stack-vert">
              ${!hd?'<div class="bar-empty"></div>':''}
              ${mo.inc>0?`<div class="bar-in" style="height:${incH}px"></div>`:''}
              ${mo.exp>0?`<div class="bar-ex" style="height:${expH}px"></div>`:''}
            </div></div>`;
        }).join('')}
      </div>
      <div class="stat-month-labels">${monthly.map(mo=>`<span>${monthShort(mo.m)[0]}</span>`).join('')}</div>
      <div class="stat-meta">
        <div class="mini"><div class="lbl">Einnahmen</div><div class="val" style="color:var(--green)">${fmtEUR(incomeTotal)}</div></div>

function renderCatBreakdown(cats,total,type){
  if(!Object.keys(cats).length)return '<div class="empty"><div class="small">Keine Buchungen vorhanden.</div></div>';
  const entries=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  return entries.map(([cat,sum])=>{const pct=total>0?(sum/total*100):0;
    return `<div class="cat-row ${type}"><div class="cat-name">${escapeHtml(cat)}</div><div class="cat-amt">${fmtEUR(sum)}</div><div class="cat-bar"><div style="width:${pct}%"></div></div></div>`;
  }).join('')+`<div class="cat-row"><div class="cat-name">Summe</div><div class="cat-amt">${fmtEUR(total)}</div></div>`;
}

      ${deadlines.map(d=>{const past=d.date<todayStr;const du=daysBetween(todayStr,d.date);const soon=!past&&du<=14;
        return `<div class="deadline-item ${past?'past':''} ${soon?'soon':''}">
          <div class="deadline-date"><div class="d">${d.date.slice(8,10)}</div><div class="m">${monthShort(parseInt(d.date.slice(5,7))-1)}</div></div>

function generateDeadlines(year,settings){
  const out=[];
  if(!settings.kleinunternehmer){
    if(settings.vatCycle==='quarterly'){
      out.push({date:`${year}-04-10`,title:`USt-Voranmeldung Q1 ${year}`,description:'Quartalsweise USt-VA (Jan–Mär).'});
      out.push({date:`${year}-07-10`,title:`USt-Voranmeldung Q2 ${year}`,description:'Quartalsweise USt-VA (Apr–Jun).'});
      out.push({date:`${year}-10-10`,title:`USt-Voranmeldung Q3 ${year}`,description:'Quartalsweise USt-VA (Jul–Sep).'});
      out.push({date:`${year+1}-01-10`,title:`USt-Voranmeldung Q4 ${year}`,description:'Quartalsweise USt-VA (Okt–Dez).'});
    } else {
      for(let m=0;m<12;m++){
        const fm=m+1;const fy=fm===12?year+1:year;const fmIdx=fm===12?0:fm;
        const d=new Date(fy,fmIdx,10);
        out.push({date:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-10`,title:`USt-Voranmeldung ${monthName(m)} ${year}`,description:`Monatliche USt-VA.`});
      }
    }
  }
  ['03','06','09','12'].forEach(m=>out.push({date:`${year}-${m}-10`,title:`Einkommensteuer-Vorauszahlung`,description:`Quartalsweise Vorauszahlung.`}));
  const py=year-1;
  if(settings.hasTaxAdvisor)out.push({date:`${year+1}-02-28`,title:`Steuererklärung ${py} (mit Berater)`,description:`Verlängerte Abgabefrist ${py}.`});
  else out.push({date:`${year}-07-31`,title:`Steuererklärung ${py}`,description:`Abgabefrist ${py}.`});

  // ZM-Erinnerungen: nur für Quartale mit Reverse-Charge-Umsätzen
  const yearRcInvoices=state.invoices.filter(i=>i.reverseCharge && (i.invoiceDate||'').startsWith(String(year)));
  const rcByQuarter={1:[],2:[],3:[],4:[]};
  yearRcInvoices.forEach(i=>{
    let refDate=i.invoiceDate||'';
    if(i.status==='paid'&&i.txId){
      const tx=state.transactions.find(t=>t.id===i.txId);
      if(tx)refDate=tx.date;
    }
    const q=quarterOf(refDate);
    if(q&&rcByQuarter[q])rcByQuarter[q].push(i);
  });
  const zmDueDates={1:[`${year}-04-25`,'Q1'],2:[`${year}-07-25`,'Q2'],3:[`${year}-10-25`,'Q3'],4:[`${year+1}-01-25`,'Q4']};
  [1,2,3,4].forEach(q=>{
    if(rcByQuarter[q].length){
      const [date,label]=zmDueDates[q];
      const totalNet=rcByQuarter[q].reduce((s,i)=>s+(i.totalNet||i.totalGross||0),0);
      out.push({
        date,
        title:`Zusammenfassende Meldung ${label}/${year}`,
        description:`${rcByQuarter[q].length} Reverse-Charge-Umsätze · Netto-Summe ${fmtEUR(totalNet)}. Abgabe über BZSt-Online-Portal (bop.bzst.bund.de) oder ELSTER.`,
      });
    }
  });

  return out;
}

// Aktive Immobilie holen
function activeProperty(){
  return state.properties.find(p=>p.id===state.activePropertyId) || null;
}

// Rental-Transaktionen für aktive Immobilie und Jahr
function rentalTxForYear(year){
  const propId=state.activePropertyId;
  if(!propId)return [];
  return state.rentalTx.filter(t=>t.propertyId===propId && t.date.startsWith(String(year)));
}

// Rental-Dashboard
function renderRentalDashboard(){
  const prop=activeProperty();
  if(!prop){
    return renderRentalEmpty();
  }
  const year=state.year;
  const tx=rentalTxForYear(year);
  const income=round2(tx.filter(t=>t.type==='income').reduce((s,t)=>s+(t.amount||0),0));
  const expense=round2(tx.filter(t=>t.type==='expense').reduce((s,t)=>s+(t.amount||0),0));
  const balance=round2(income-expense);
  // Kredit-Info
  const loan=state.loans.find(l=>l.propertyId===prop.id);
  let loanInfo=null;
  if(loan){
    const yearPayments=state.loanPayments.filter(p=>p.loanId===loan.id && p.date.startsWith(String(year)));
    const yearInterest=round2(yearPayments.reduce((s,p)=>s+(p.interest||0),0));
    const yearPrincipal=round2(yearPayments.reduce((s,p)=>s+(p.principal||0),0));
    const totalInterest=round2(state.loanPayments.filter(p=>p.loanId===loan.id).reduce((s,p)=>s+(p.interest||0),0));
    const totalPrincipal=round2(state.loanPayments.filter(p=>p.loanId===loan.id).reduce((s,p)=>s+(p.principal||0),0));
    const remaining=round2((loan.initialAmount||0)-totalPrincipal);
    loanInfo={loan, yearInterest, yearPrincipal, totalInterest, totalPrincipal, remaining};
  }
  // AfA-Info
  const assetsForProp=state.assets.filter(a=>a.propertyId===prop.id);
  const yearAfa=round2(assetsForProp.reduce((s,a)=>s+calcYearlyAfA(a, year),0));

      <div class="kpi income"><div class="k-label">Miet-Einnahmen ${year}</div><div class="k-value">${fmtEUR(income)}</div><div class="k-sub">${tx.filter(t=>t.type==='income').length} Buchungen</div></div>
      <div class="kpi expense"><div class="k-label">Ausgaben ${year}</div><div class="k-value">${fmtEUR(expense)}</div><div class="k-sub">${tx.filter(t=>t.type==='expense').length} Buchungen</div></div>
      <div class="kpi kpi-profit"><div class="k-label">Cashflow ${year}</div><div class="k-value">${fmtEUR(balance,{signed:true})}</div><div class="k-sub">Einnahmen ${fmtEUR(income)} · Ausgaben ${fmtEUR(expense)}</div></div>
    </div>

    <div class="quick-actions">
      <button class="quick income" data-action="new-rental-income"><span class="plus">+</span><span class="t">Miete</span><span class="s">Erfassen & buchen</span></button>
      <button class="quick expense" data-action="new-rental-expense"><span class="plus">+</span><span class="t">Ausgabe</span><span class="s">Reparatur, Hausgeld …</span></button>
      <button class="quick invoice" data-action="new-loan-payment"><span class="plus">💳</span><span class="t">Kredit-Zahlung</span><span class="s">Zins + Tilgung</span></button>
    </div>

    ${loanInfo?`<div class="card" style="margin-top:14px"><div class="section-title">Kredit ${escapeHtml(loanInfo.loan.name||'')}
      <button class="btn btn-ghost btn-sm" data-view-goto="r-loan">Details</button></div>

        <div style="background:var(--bg-sunk);padding:10px 12px;border-radius:8px"><div style="color:var(--ink-muted);font-size:11px;text-transform:uppercase">Zinsen ${year}</div><div class="num" style="font-size:18px;font-weight:600;color:var(--terra)">${fmtEUR(loanInfo.yearInterest)}</div><div style="font-size:11px;color:var(--ink-muted)">Werbungskosten</div></div>

// AfA-Berechnung: linear über usefulLifeYears
function calcYearlyAfA(asset, year){
  if(!asset || !asset.usefulLifeYears || !asset.cost) return 0;
  const acq=new Date(asset.acquisitionDate);
  if(isNaN(acq.getTime())) return 0;
  const acqYear=acq.getFullYear();
  const acqMonth=acq.getMonth()+1;
  if(year<acqYear) return 0;
  if(year>=acqYear+asset.usefulLifeYears+1) return 0; // nach vollständiger AfA
  const yearlyRate=asset.cost/asset.usefulLifeYears;
  // Anschaffungsjahr: anteilig pro Monat
  if(year===acqYear){
    const months=12-acqMonth+1;
    return round2(yearlyRate*months/12);
  }
  // Letztes Jahr: Rest zur Auffüllung
  if(year===acqYear+asset.usefulLifeYears){
    const months=acqMonth-1;
    return round2(yearlyRate*months/12);
  }
  return round2(yearlyRate);
}

// Kumulierte AfA bis Ende Jahr (Restbuchwert = cost - kumuliert)
function calcCumulativeAfA(asset, year){
  if(!asset || !asset.cost) return 0;
  const acq=new Date(asset.acquisitionDate);
  if(isNaN(acq.getTime())) return 0;
  let cum=0;
  for(let y=acq.getFullYear(); y<=year; y++){
    cum+=calcYearlyAfA(asset, y);
  }
  return Math.min(round2(cum), asset.cost);
}

function renderAssetsView(){
  const prop=activeProperty();

  const totalCost=round2(assets.reduce((s,a)=>s+(a.cost||0),0));

  return `

async function savePropertyFromModal(id, isNew){
  const get=k=>document.getElementById(k)?.value||'';
  const parsedCost=parseAmount(get('p-cost'));
  const building=parseAmount(get('p-building'));
  const land=parseAmount(get('p-land'));
  const data={
    id,
    name:get('p-name').trim(),
    street:get('p-street').trim(),
    zip:get('p-zip').trim(),
    city:get('p-city').trim(),
    acquisitionDate:get('p-acq'),
    acquisitionCost:parsedCost,
    buildingShare:building,
    landShare:land,
    purchaseCosts:parseAmount(get('p-purchase')),
  };
  if(!data.name){toast('Bitte einen Namen eingeben');return;}
  if(isNew){
    state.properties.push(data);
    state.activePropertyId=data.id;
    // Bei erster Immobilie: automatisch Gebäude als Asset anlegen falls Werte da sind
    if(building>0 && data.acquisitionDate){
      state.assets.push({
        id:uid('asset'),
        propertyId:data.id,
        name:'Gebäude',
        category:'Gebäude',
        acquisitionDate:data.acquisitionDate,
        cost:building,
        usefulLifeYears:50, // Standardnutzungsdauer nach §7 Abs.4 EStG (2%)
        notes:'Automatisch aus Immobilien-Stammdaten angelegt.',
      });
      await saveAssets();
    }
  } else {
    const idx=state.properties.findIndex(x=>x.id===id);
    if(idx>=0)state.properties[idx]=data;
  }
  await saveProperties();
  await saveMode();
  toast(isNew?'Immobilie angelegt':'Gespeichert');
  closeModal();render();
}

async function deletePropertyConfirm(id){
  const p=state.properties.find(x=>x.id===id);
  if(!p)return;
  const linkedTx=state.rentalTx.filter(t=>t.propertyId===id).length;
  const linkedLoans=state.loans.filter(l=>l.propertyId===id).length;
  const linkedAssets=state.assets.filter(a=>a.propertyId===id).length;
  const msg=`Immobilie "${p.name}" wirklich löschen?\n\n${linkedTx} Buchungen, ${linkedLoans} Kredite, ${linkedAssets} Wirtschaftsgüter werden mitgelöscht.`;
  if(!confirm(msg))return;
  state.properties=state.properties.filter(x=>x.id!==id);
  state.rentalTx=state.rentalTx.filter(t=>t.propertyId!==id);
  state.loans=state.loans.filter(l=>l.propertyId!==id);
  state.loanPayments=state.loanPayments.filter(p=>{const l=state.loans.find(l=>l.id===p.loanId);return !!l;});
  state.assets=state.assets.filter(a=>a.propertyId!==id);
  if(state.activePropertyId===id){
    state.activePropertyId=state.properties[0]?.id||null;
  }
  await saveProperties();
  await saveRentalTx();
  await saveLoans();
  await saveLoanPayments();
  await saveAssets();
  await saveMode();
  toast('Immobilie gelöscht');
  closeModal();render();
}

async function saveRentalTxFromModal(id, type, isNew){
  const get=k=>document.getElementById(k)?.value||'';
  const isChecked=k=>document.getElementById(k)?.checked||false;
  const existing=state.rentalTx.find(t=>t.id===id);
  const data={
    id,
    propertyId:state.activePropertyId,
    type,
    date:get('rt-date')||todayISO(),
    category:get('rt-category'),
    amount:parseAmount(get('rt-amount')),
    description:get('rt-desc').trim(),
    notes:get('rt-notes').trim(),
    receiptIds:existing?[...(existing.receiptIds||[])]:[],
  };
  if(!data.amount){toast('Bitte einen Betrag eingeben');return;}
  // Eigenbeleg-Daten für Ausgaben
  if(type==='expense' && isChecked('rt-eigenbeleg')){
    const purpose=get('rt-eb-purpose').trim();
    const recipient=get('rt-eb-recipient').trim();
    if(!purpose||!recipient){
      toast('Für Eigenbeleg bitte Empfänger und Zweck ausfüllen');
      return;
    }
    data.eigenbeleg=true;
    data.eigenbelegData={
      recipient,
      purpose,
      reason:get('rt-eb-reason')||'verloren',
      createdAt:new Date().toISOString(),
    };
  }
  // Entfernte Belege aus Storage löschen
  if(state._removedReceipts&&state._removedReceipts.length){
    for(const rid of state._removedReceipts){
      data.receiptIds=data.receiptIds.filter(x=>x!==rid);
      await deleteReceiptStore(rid);
    }
  }
  // Neue (pending) Belege speichern und ID an data.receiptIds anhängen
  if(state.pendingReceipts&&state.pendingReceipts.length){
    for(const p of state.pendingReceipts){
      if(p._originalFile){
        try{
          const rec=await saveReceipt(id, p._originalFile);
          data.receiptIds.push(rec.id);
        }catch(e){console.warn('Beleg konnte nicht gespeichert werden:',e);}
      }
    }
  }
  if(isNew){state.rentalTx.push(data);}
  else {
    const idx=state.rentalTx.findIndex(t=>t.id===id);
    if(idx>=0)state.rentalTx[idx]=data;
  }
  await saveRentalTx();
  state.pendingReceipts=[];
  state._removedReceipts=[];
  toast(data.eigenbeleg?'Gespeichert mit Eigenbeleg':`Gespeichert${data.receiptIds.length?' · '+data.receiptIds.length+' Beleg(e)':''}`);
  closeModal();
  render();
  // Bei neuer Buchung mit Eigenbeleg: gleich das PDF anzeigen
  if(isNew && data.eigenbeleg){
    setTimeout(()=>printEigenbeleg(data.id),300);
  }
}

function exportRentalCSV(){
  const prop=activeProperty();
  if(!prop){toast('Keine Immobilie ausgewählt');return;}
  const year=state.year;
  const tx=rentalTxForYear(year);
  const loan=state.loans.find(l=>l.propertyId===prop.id);
  const loanPayments=loan?state.loanPayments.filter(p=>p.loanId===loan.id && p.date.startsWith(String(year))):[];
  const assets=state.assets.filter(a=>a.propertyId===prop.id);
  const rows=[];
  rows.push([`Vermietungs-Übersicht ${year}`]);
  rows.push([`Objekt: ${prop.name}`]);
  rows.push([`Adresse: ${[prop.street,prop.zip,prop.city].filter(Boolean).join(', ')}`]);
  rows.push([`Erstellt am: ${new Date().toLocaleString('de-DE')}`]);
  rows.push([]);
  rows.push(['=== EINNAHMEN ===']);
  rows.push(['Datum','Kategorie','Beschreibung','Betrag','Belege','Notizen']);
  const income=tx.filter(t=>t.type==='income').sort((a,b)=>a.date.localeCompare(b.date));
  income.forEach(t=>rows.push([t.date,t.category,t.description,toCsvNum(t.amount),(t.receiptIds||[]).length+' Beleg(e)',(t.notes||'').replace(/\n/g,' ')]));
  rows.push(['','','Summe Einnahmen',toCsvNum(income.reduce((s,t)=>s+t.amount,0))]);
  rows.push([]);
  rows.push(['=== AUSGABEN (Werbungskosten) ===']);
  rows.push(['Datum','Kategorie','Beschreibung','Betrag','Belege','Eigenbeleg','Notizen']);
  const expense=tx.filter(t=>t.type==='expense').sort((a,b)=>a.date.localeCompare(b.date));
  expense.forEach(t=>rows.push([t.date,t.category,t.description,toCsvNum(t.amount),(t.receiptIds||[]).length+' Beleg(e)',t.eigenbeleg?'ja':'',(t.notes||'').replace(/\n/g,' ')]));
  rows.push(['','','Summe Ausgaben',toCsvNum(expense.reduce((s,t)=>s+t.amount,0))]);
  rows.push([]);
  if(loan){
    rows.push(['=== KREDIT-ZAHLUNGEN ==='] );
    rows.push([`Kredit: ${loan.name} · ${loan.bank}`]);
    rows.push(['Datum','Zinsen (Werbungskosten)','Tilgung (nicht abziehbar)','Notiz']);
    loanPayments.sort((a,b)=>a.date.localeCompare(b.date)).forEach(p=>rows.push([p.date,toCsvNum(p.interest||0),toCsvNum(p.principal||0),(p.note||'').replace(/\n/g,' ')]));
    const totI=loanPayments.reduce((s,p)=>s+(p.interest||0),0);
    const totP=loanPayments.reduce((s,p)=>s+(p.principal||0),0);
    rows.push(['','Summe Zinsen',toCsvNum(totI),'']);
    rows.push(['','Summe Tilgung',toCsvNum(totP),'']);
    rows.push([]);
  }
  if(assets.length){
    rows.push(['=== ABSCHREIBUNGEN (AfA) ===']);
    rows.push(['Wirtschaftsgut','Kategorie','Anschaffungsdatum','Anschaffungskosten','Nutzungsdauer','AfA '+year,'Kum. AfA Ende '+year,'Restbuchwert']);
    assets.forEach(a=>{
      const yAfa=calcYearlyAfA(a, year);
      const cAfa=calcCumulativeAfA(a, year);
      const bv=round2((a.cost||0)-cAfa);
      rows.push([a.name,a.category,a.acquisitionDate,toCsvNum(a.cost||0),String(a.usefulLifeYears)+' J.',toCsvNum(yAfa),toCsvNum(cAfa),toCsvNum(bv)]);
    });
    rows.push(['','','','','Summe AfA '+year,toCsvNum(assets.reduce((s,a)=>s+calcYearlyAfA(a, year),0))]);
    rows.push([]);
  }
  rows.push(['=== ZUSAMMENFASSUNG FÜR ANLAGE V ===']);
  const totalIncome=income.reduce((s,t)=>s+t.amount,0);
  const totalExpense=expense.reduce((s,t)=>s+t.amount,0);
  const totalAfA=assets.reduce((s,a)=>s+calcYearlyAfA(a, year),0);
  rows.push(['Einnahmen',toCsvNum(totalIncome)]);
  rows.push(['Ausgaben (ohne AfA)',toCsvNum(totalExpense)]);
  rows.push(['AfA',toCsvNum(totalAfA)]);
  rows.push(['Werbungskosten gesamt',toCsvNum(totalExpense+totalAfA)]);
  rows.push(['Überschuss / Verlust',toCsvNum(totalIncome-totalExpense-totalAfA)]);
  rows.push([]);
  rows.push(['Hinweis: Zahlen sind Vorarbeit für WISO Steuer.']);
  rows.push(['Erhaltungsaufwand vs. Herstellungskosten wurde NICHT geprüft - bitte in WISO klären.']);
  const csv=rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
  download(`vermietung_${prop.name.replace(/[^a-zA-Z0-9]/g,'_')}_${year}.csv`,'\uFEFF'+csv,'text/csv;charset=utf-8');
  toast('CSV-Export heruntergeladen');
}

function exportCSV(year){
  const list=state.transactions.filter(t=>t.date.startsWith(String(year)));

  const header=['Datum','Typ','Kategorie','Beschreibung','Geschäftspartner','Beleg-Nr','Netto','USt-Satz','USt-Betrag','Brutto','Belege','Notizen'];

// SKR03-Konten-Mapping (vereinfacht, decken die wichtigsten EÜR-Fälle ab)
// Bei Mischfällen sollte der Steuerberater das Mapping anpassen.
const SKR03_INCOME_MAP = {
  'Warenverkauf':'8400',           // Erlöse 19% USt
  'Dienstleistungen':'8400',
  'Zinsen / Kapitalerträge':'8100',
  'Mieteinnahmen':'8120',
  'Sonstige Einnahmen':'8500',
  'Privateinlage':'1890',
};
const SKR03_EXPENSE_MAP = {
  'Wareneinkauf':'3400',
  'Fremdleistungen':'3100',
  'Anbieter-Auszahlungen (Marketplace)':'3100',
  'Personalkosten':'4100',
  'Raumkosten (Miete)':'4210',
  'Nebenkosten (Strom, Heizung)':'4240',
  'Bürobedarf':'4930',
  'Porto & Versand':'4910',
  'Telefon & Internet':'4920',
  'Reisekosten':'4660',
  'Kfz-Kosten':'4530',
  'Bewirtung':'4650',
  'Werbung & Marketing':'4980',
  'Versicherungen':'4360',
  'Fortbildung & Literatur':'4940',
  'Beratungskosten (Steuerberater, Anwalt)':'4955',
  'Software & IT-Abos':'4985',
  'Geringwertige Wirtschaftsgüter':'4855',
  'Abschreibungen (AfA)':'4830',
  'Bankgebühren':'4970',
  'Zahlungsanbieter-Gebühren (Stripe, PayPal)':'4970',
  'Gewerbesteuer / sonstige Steuern':'4320',
  'Sonstige Ausgaben':'4900',
};

// Kollege Bank/Kasse als Gegenkonto (typisch SKR03 1200 = Bank)
const SKR03_BANK_KONTO = '1200';

// DATEV-Steuerschlüssel (Mehrwertsteuer-Schlüssel SKR03)
function datevTaxKey(rate, type){
  // type = income oder expense; Hankebuch Sätze: 19, 7, 0
  if(type==='income'){
    if(rate===19)return '3'; // Erlöse 19% USt
    if(rate===7) return '2'; // Erlöse 7% USt
    return '0';
  } else {
    if(rate===19)return '9'; // Vorsteuer 19%
    if(rate===7) return '8'; // Vorsteuer 7%
    return '0';
  }
}

function safeFilename(s){return String(s||'').replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,'_').slice(0,80);}

// Erzeugt das DATEV-CSV (vereinfachter Buchungsstapel) für ein Jahr
function buildDatevCSV(year){
  const transactions=state.transactions.filter(t=>t.date.startsWith(String(year)));
  transactions.sort((a,b)=>a.date.localeCompare(b.date));
  const wj=year;
  const headerRow1=[
    '"EXTF"',                    // Format-Kennzeichen
    '700',                        // Versionsnummer
    '21',                         // Datenkategorie: 21 = Buchungsstapel
    '"Buchungsstapel"',           // Formatname
    '12',                         // Formatversion
    new Date().toISOString().replace(/\D/g,'').slice(0,14)+'000',  // Erzeugt am
    '',                           // Importiert
    '"hb"',                       // Herkunft
    '"Hankebuch"',                // Exportiert von
    '"Hankebuch"',                // Importiert von
    '',                           // Beraternummer
    '',                           // Mandantennummer
    `${wj}0101`,                  // WJ-Beginn
    '4',                          // Sachkontenlänge
    `${wj}0101`,                  // Datum von
    `${wj}1231`,                  // Datum bis
    `"Hankebuch ${wj}"`,          // Bezeichnung
    `"${(state.settings.ownerName||state.settings.businessName||'').replace(/"/g,'')}"`,  // Diktatkürzel
    '1',                          // Buchungstyp: 1 = Finanzbuchführung
    '0',                          // Rechnungslegungszweck
    '0',                          // Festschreibung: 0 = keine
    '"EUR"',                      // WKZ
    '','','','','',''             // Reserve-Felder
  ].join(';');

  // Spaltenüberschriften (Hauptversion 700 / Format 12)
  const headerRow2=[
    'Umsatz (ohne Soll/Haben-Kz)','Soll/Haben-Kennzeichen','WKZ Umsatz',
    'Kurs','Basis-Umsatz','WKZ Basis-Umsatz',
    'Konto','Gegenkonto (ohne BU-Schlüssel)','BU-Schlüssel',
    'Belegdatum','Belegfeld 1','Belegfeld 2',
    'Skonto','Buchungstext'
  ].join(';');

  const rows=[];
  transactions.forEach(t=>{
    const isIncome=t.type==='income';
    const skrKonto=isIncome
      ? (SKR03_INCOME_MAP[t.category]||'8400')
      : (SKR03_EXPENSE_MAP[t.category]||'4900');
    const sh=isIncome?'H':'S';
    const konto=skrKonto;
    const gegenkonto=SKR03_BANK_KONTO;
    const dt=(t.date||'').slice(5).replace('-','')+''; // mmdd → wir wollen ttmm
    const dateForDatev=dt.slice(2,4)+dt.slice(0,2);
    const beleg1=(t.invoiceNumber||t.id||'').toString().slice(0,36);
    const text=((t.description||'')+(t.contact?' · '+t.contact:'')).replace(/[\r\n]/g,' ').slice(0,60);
    // Multi-USt: pro Position eine separate Zeile, sonst eine Zeile
    const positions=Array.isArray(t.vatBreakdown)&&t.vatBreakdown.length
      ? t.vatBreakdown.map(b=>({rate:b.rate,gross:round2(b.net+b.vat)}))
      : [{rate:t.vatRate||0,gross:Math.abs(t.gross||0)}];
    positions.forEach((pos,idx)=>{
      const umsatz=pos.gross.toFixed(2).replace('.', ',');
      const buSchluessel=datevTaxKey(pos.rate, t.type);
      const positionText=positions.length>1?`${text} (${pos.rate}%)`:text;
      rows.push([
        umsatz, sh, 'EUR', '','', '',
        konto, gegenkonto, buSchluessel,
        dateForDatev,
        `"${beleg1.replace(/"/g,"'")}"`,
        '', '',
        `"${positionText.replace(/"/g,"'")}"`,
      ].join(';'));
    });
  });
  return [headerRow1, headerRow2, ...rows].join('\r\n');
}

EXTF_Buchungsstapel_${year}.csv   DATEV-konformes CSV (Buchungsstapel, Format 700/12) für DATEV-Import.

${(()=>{

Ausgaben:     ${fmtEUR(exp)}

Buchungen:    ${yearTx.length}
Rechnungen:   ${yearInv.length}
Gutschriften: ${yearCN.length}`;
})()}
`;
    zip.file('README.txt', README);

    // 2) Standard-CSV (gleich wie exportCSV, nur in ZIP)
    const stdHeader=['Datum','Typ','Kategorie','Beschreibung','Geschäftspartner','Beleg-Nr','Netto','USt-Satz','USt-Betrag','Brutto','Belege','Notizen'];
    const stdRows=yearTx.map(t=>[t.date,t.type==='income'?'Einnahme':'Ausgabe',t.category,(t.description||''),(t.contact||''),(t.invoiceNumber||''),toCsvNum(t.net),(t.vatRate||0)+'%',toCsvNum(t.vat),toCsvNum(t.gross),(t.receiptIds||[]).length+' Beleg(e)',(t.notes||'').replace(/\n/g,' ')]);
    const stdCsv=[stdHeader,...stdRows].map(r=>r.map(csvCell).join(';')).join('\r\n');
    zip.file(`journal_${year}.csv`, '\uFEFF'+stdCsv);

    // 3) DATEV-CSV
    const datevCsv=buildDatevCSV(year);
    zip.file(`EXTF_Buchungsstapel_${year}.csv`, datevCsv);

    // 4) Belege sammeln
    const beleg=zip.folder('belege');
    const indexRows=[['Buchungs-ID','Datum','Typ','Beleg-Nr','Beschreibung','Brutto','Beleg-Datei']];
    let belegCount=0;
    for(const t of yearTx){
      const baseName=`${t.date}_${safeFilename((t.invoiceNumber||t.id).slice(0,20))}_${safeFilename((t.contact||t.description||'').slice(0,40))}`;
      if(t.receiptIds && t.receiptIds.length){
        for(let idx=0;idx<t.receiptIds.length;idx++){
          const rcptId=t.receiptIds[idx];
          try{
            const r=await loadReceipt(rcptId);
            if(!r||!r.data)continue;
            // base64 → binary (kann data:URL prefix haben)
            const b64=r.data.includes(',')?r.data.split(',')[1]:r.data;
            const ext=(r.filename||'').split('.').pop()||(r.mime?.includes('pdf')?'pdf':r.mime?.includes('jpeg')?'jpg':r.mime?.includes('png')?'png':'bin');
            const fname=`${baseName}_${idx+1}.${ext}`;
            beleg.file(fname, b64, {base64:true});
            indexRows.push([t.id,t.date,t.type==='income'?'Einnahme':'Ausgabe',(t.invoiceNumber||''),(t.description||''),toCsvNum(t.gross),`belege/${fname}`]);
            belegCount++;
          }catch(e){console.warn('Beleg konnte nicht gelesen werden:',rcptId,e);}
        }
      } else {
        indexRows.push([t.id,t.date,t.type==='income'?'Einnahme':'Ausgabe',(t.invoiceNumber||''),(t.description||''),toCsvNum(t.gross),'(kein Beleg)']);
      }
    }
    const indexCsv=indexRows.map(r=>r.map(csvCell).join(';')).join('\r\n');
    zip.file('INDEX.csv', '\uFEFF'+indexCsv);

    // 5) Rechnungen als HTML
    if(yearInv.length){
      const rFolder=zip.folder('rechnungen');
      for(const inv of yearInv){
        try{
          const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Rechnung ${escapeHtml(inv.number)}</title></head><body>${renderInvoicePdfHTML(inv)}</body></html>`;
          const fname=`${inv.date||'undatiert'}_${safeFilename(inv.number)}_${safeFilename((inv.recipient?.name||'').slice(0,40))}.html`;
          rFolder.file(fname, html);
          // XRechnung-XML zusätzlich für B2B-Archiv
          try{
            const {xml}=buildXRechnungUBL(inv);
            const xmlName=`${inv.date||'undatiert'}_${safeFilename(inv.number)}_XRechnung.xml`;
            rFolder.file(xmlName, xml);
          }catch(e){console.warn('XRechnung XML fehlgeschlagen:',inv.number,e);}
        }catch(e){console.warn('Rechnung konnte nicht erzeugt werden:',inv.number,e);}
      }
    }

    // 6) Gutschriften als HTML
    if(yearCN.length){
      const gFolder=zip.folder('gutschriften');
      for(const cn of yearCN){
        try{
          const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${escapeHtml(cn.number)}</title></head><body>${renderCreditNotePdfHTML(cn)}</body></html>`;
          const fname=`${cn.issueDate||'undatiert'}_${safeFilename(cn.number)}_${safeFilename((cn.vendorSnapshot?.name||'').slice(0,40))}.html`;
          gFolder.file(fname, html);
        }catch(e){console.warn('Gutschrift konnte nicht erzeugt werden:',cn.number,e);}
      }
    }

    // ZIP generieren und herunterladen
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`hankebuch_finanzamt_${year}_${todayISO()}.zip`;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
    toast(`Paket erstellt: ${yearTx.length} Buchungen, ${belegCount} Belege, ${yearInv.length} Rechnungen, ${yearCN.length} Gutschriften`);
  }catch(e){
    console.error(e);
    toast('Fehler beim Export: '+e.message);
  }
}


async function importWooCommerce(file){
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    if(data.format!=='hankebuch_woocommerce_v1'){
      toast('Ungültiges Format – ist das eine Hankebuch-WooCommerce-Datei?');return;
    }
    if(!Array.isArray(data.orders)){toast('Keine Bestellungen gefunden');return;}
    const shopUrl=data.shop_url||'unknown';

    // --- Anbieter-Import aus Product Vendors ---
    let vendorsNew=0, vendorsUpdated=0, vendorsUnchanged=0;
    if(Array.isArray(data.vendors) && data.vendors.length){
      for(const pv of data.vendors){
        // Suche nach vorhandenem Anbieter in Hankebuch:
        //   1) über bereits gespeicherte productVendorId+Shop
        //   2) über E-Mail (case-insensitiv)
        //   3) über exakten Namen
        const pvEmail=(pv.email||'').toLowerCase().trim();
        const pvName=(pv.name||'').trim();
        let existing=state.vendors.find(v=>v.productVendorId===pv.vendor_id && v.productVendorShop===shopUrl);
        if(!existing && pvEmail) existing=state.vendors.find(v=>(v.email||'').toLowerCase().trim()===pvEmail);
        if(!existing && pvName) existing=state.vendors.find(v=>v.name===pvName);

        if(!existing){
          // Neu anlegen
          const newVendor={
            id:uid('ven'),
            createdAt:new Date().toISOString(),
            name:pvName || pv.vendor_slug || `Vendor #${pv.vendor_id}`,
            company:'',
            street:pv.address1 ? (pv.address2 ? `${pv.address1} ${pv.address2}` : pv.address1) : '',
            zip:pv.postcode || '',
            city:pv.city || '',
            country:pv.country || 'Deutschland',
            email:pv.email || '',
            phone:pv.phone || '',
            taxNumber:pv.tax_id || '',
            vatId:'',
            iban:'',
            bic:'',
            bankName:'',
            commissionPct:typeof pv.commission==='number' ? pv.commission : 15,
            kleinunternehmer:false,
            notes:pv.description || '',
            productVendorId:pv.vendor_id,
            productVendorShop:shopUrl,
          };
          state.vendors.push(newVendor);
          vendorsNew++;
        } else {
          // Intelligent aktualisieren: nur leere Felder ergänzen, nie überschreiben
          let changed=false;
          const updates={};
          const maybeSet=(key,value)=>{
            const cur=(existing[key]||'').toString().trim();
            const incoming=(value==null?'':value.toString()).trim();
            if(!cur && incoming){ updates[key]=value; changed=true; }
          };
          maybeSet('email', pv.email);
          maybeSet('phone', pv.phone);
          maybeSet('street', pv.address1 ? (pv.address2 ? `${pv.address1} ${pv.address2}` : pv.address1) : '');
          maybeSet('zip', pv.postcode);
          maybeSet('city', pv.city);
          maybeSet('country', pv.country);
          maybeSet('taxNumber', pv.tax_id);
          maybeSet('notes', pv.description);
          // Provisionssatz: aktualisieren, wenn neuer Wert numerisch UND sich tatsächlich unterscheidet
          if(typeof pv.commission==='number' && pv.commission !== existing.commissionPct){
            updates.commissionPct=pv.commission;
            changed=true;
          }
          // Product-Vendors-ID und Shop immer synchronisieren (hilft bei späteren Matches)
          if(existing.productVendorId!==pv.vendor_id){updates.productVendorId=pv.vendor_id;changed=true;}
          if(existing.productVendorShop!==shopUrl){updates.productVendorShop=shopUrl;changed=true;}
          if(changed){
            Object.assign(existing,updates);
            vendorsUpdated++;
          } else {
            vendorsUnchanged++;
          }
        }
      }
      await saveVendors();
    }

    // Vorhandene Bestellungen als Map: key → Index in state.invoices
    const existingMap=new Map();
    state.invoices.forEach((i,idx)=>{
      if(i.wooOrderId) existingMap.set(`${i.wooShopUrl}::${i.wooOrderId}`, idx);
    });
    // Vorhandene Gebühren-Buchungen: key → transaction
    const existingFees=new Map();
    state.transactions.forEach(t=>{
      if(t.wooFeeOrderId) existingFees.set(`${t.wooShopUrl}::${t.wooFeeOrderId}`, t);
    });
    let imported=0,skipped=0,updated=0,asInvoiceCount=0,pdfsAttached=0,feesAdded=0;
    for(const order of data.orders){
      const key=`${shopUrl}::${order.order_id}`;
      const newNumber=order.pdf_invoice?.invoice_number || `WC-${order.order_number||order.order_id}`;

      // --- FALL: Vorhanden? Dann prüfen ob Update nötig ---
      if(existingMap.has(key)){
        const invIdx=existingMap.get(key);
        const existingInv=state.invoices[invIdx];
        let changed=false;

        // Rechnungsnummer hat sich verbessert (echte Germanized-Nr statt WC-Fallback)?
        const hadFallback=existingInv.number && existingInv.number.startsWith('WC-');
        const newIsReal=!newNumber.startsWith('WC-');
        if(hadFallback && newIsReal && newNumber!==existingInv.number){
          existingInv.number=newNumber;
          if(existingInv.txId){
            const tx=state.transactions.find(t=>t.id===existingInv.txId);
            if(tx){
              tx.invoiceNumber=newNumber;
              tx.description=`${newNumber} · ${existingInv.customer?.name||''}`.trim();
            }
          }
          changed=true;
        }

        // PDF nachliefern, falls jetzt vorhanden und vorher nicht
        if(order.pdf_invoice?.data && existingInv.txId){
          const tx=state.transactions.find(t=>t.id===existingInv.txId);
          if(tx && (!tx.receiptIds || tx.receiptIds.length===0)){
            try{
              const receiptId=await saveReceiptFromData(tx.id, order.pdf_invoice);
              tx.receiptIds=tx.receiptIds||[];
              tx.receiptIds.push(receiptId);
              pdfsAttached++;
              changed=true;
            }catch(e){console.warn('PDF-Beleg konnte nicht gespeichert werden:',e);}
          }
        }

        // Vendor-Zuordnungen nachliefern, falls jetzt vorhanden und vorher nicht
        if(Array.isArray(order.vendors) && order.vendors.length && existingInv.txId){
          const tx=state.transactions.find(t=>t.id===existingInv.txId);
          if(tx && (!tx.wooVendors || tx.wooVendors.length===0)){
            tx.wooVendors=order.vendors;
            tx.wooOrderId=order.order_id;
            tx.wooShopUrl=shopUrl;
            changed=true;
          }
        }

        // Zahlungsgebühr nachliefern, falls noch nicht gebucht
        if(order.payment_fee && order.payment_fee.amount>0 && !existingFees.has(key)){
          const feeTx=buildFeeTransaction(order,existingInv,shopUrl,data.shop);
          state.transactions.push(feeTx);
          existingFees.set(key,feeTx);
          feesAdded++;
          changed=true;
        }

        if(changed) updated++;
        else skipped++;
        continue;
      }

      // --- FALL: Neu anlegen ---
      const isPaid=order.paid_date||['completed','processing'].includes(order.status);
      const invoiceDate=order.paid_date||order.order_date||todayISO();
      const items=(order.items||[]).map(it=>({
        description:it.description||'(Position)',
        qty:it.qty||1,
        unit:it.unit||'Stk.',
        unitPrice:it.unit_price_net||0,
        vatRate:it.vat_rate||0,
      }));
      if(!items.length)continue;
      const inv={
        id:uid('inv'),
        number:newNumber,
        status:isPaid?'paid':'sent',
        invoiceDate:invoiceDate,
        serviceDate:order.order_date||invoiceDate,
        dueDate:invoiceDate,
        customer:{
          name:order.customer?.name||'Unbekannt',
          street:order.customer?.street||'',
          zip:order.customer?.zip||'',
          city:order.customer?.city||'',
          country:order.customer?.country==='DE'?'Deutschland':(order.customer?.country||'Deutschland'),
          email:order.customer?.email||'',
        },
        items:items,
        introText:'',
        paymentTerms:`Bezahlt über ${order.payment_method||'Online-Zahlung'}.`,
        footerNote:`Importiert aus WooCommerce-Bestellung #${order.order_number||order.order_id}.`,
        includeKleinunternehmerNotice:state.settings.kleinunternehmer,
        wooOrderId:order.order_id,
        wooOrderNumber:order.order_number,
        wooShopUrl:shopUrl,
      };
      computeInvoiceTotals(inv);
      let txId=null;
      if(isPaid){
        txId=uid();
        const tx={
          id:txId,type:'income',date:invoiceDate,
          description:`${inv.number} · ${order.customer?.name||''}`.trim(),
          contact:order.customer?.name||'',
          invoiceNumber:inv.number,
          category:INCOME_CATEGORIES[1],
          gross:inv.totalGross,net:inv.totalNet,vat:inv.totalVat,
          vatRate:inv.vatBreakdown[0]?.rate||0,
          notes:`Auto-Import aus WooCommerce (${data.shop||shopUrl})`,
          createdAt:new Date().toISOString(),
          receiptIds:[],
          wooOrderId:order.order_id,
          wooOrderNumber:order.order_number,
          wooShopUrl:shopUrl,
          wooVendors:Array.isArray(order.vendors)?order.vendors:[],
        };
        if(order.pdf_invoice&&order.pdf_invoice.data){
          try{
            const receiptId=await saveReceiptFromData(txId,order.pdf_invoice);
            tx.receiptIds.push(receiptId);
            pdfsAttached++;
          }catch(e){console.warn('PDF-Beleg konnte nicht gespeichert werden:',e);}
        }
        state.transactions.push(tx);
        inv.txId=txId;

        // Zahlungsgebühr als separate Ausgabe anlegen
        if(order.payment_fee && order.payment_fee.amount>0){
          const feeTx=buildFeeTransaction(order,inv,shopUrl,data.shop);
          state.transactions.push(feeTx);
          existingFees.set(key,feeTx);
          feesAdded++;
        }
      }
      state.invoices.push(inv);
      imported++;
      if(isPaid)asInvoiceCount++;
    }
    await saveTransactions();
    await saveInvoices();
    let msg=`${imported} neu · ${updated} aktualisiert · ${skipped} unverändert`;
    if(asInvoiceCount)msg+=` · ${asInvoiceCount} als Einnahme gebucht`;
    if(pdfsAttached)msg+=` · ${pdfsAttached} PDFs angehängt`;
    if(feesAdded)msg+=` · ${feesAdded} Gebühren gebucht`;
    if(vendorsNew||vendorsUpdated)msg+=` · ${vendorsNew} Anbieter neu, ${vendorsUpdated} aktualisiert`;
    toast(msg);
    closeModal();render();
  }catch(e){toast('Import fehlgeschlagen: '+e.message);}
}

// Baut eine Transaktion für eine Zahlungsanbieter-Gebühr (Stripe/PayPal).
// Gebühren sind USt-frei nach §4 Nr. 8 UStG (Finanzdienstleistungen).
function buildFeeTransaction(order,inv,shopUrl,shopName){
  const pf=order.payment_fee;
  const provider=pf.provider||'Zahlungsanbieter';
  const feeAmount=pf.amount||0;
  return {
    id:uid(),
    type:'expense',
    date:order.paid_date||order.order_date||todayISO(),
    description:`${provider}-Gebühr · ${inv.number||('WC-'+order.order_id)}`,
    contact:provider,
    invoiceNumber:'',
    category:'Zahlungsanbieter-Gebühren (Stripe, PayPal)',
    gross:feeAmount, net:feeAmount, vat:0, vatRate:0,
    notes:`Zahlungs-Gebühr für WooCommerce-Bestellung #${order.order_number||order.order_id}${pf.net?`. Netto-Auszahlung: ${pf.net} ${pf.currency||'EUR'}`:''}`,
    createdAt:new Date().toISOString(),
    receiptIds:[],
    wooFeeOrderId:order.order_id,
    wooShopUrl:shopUrl,
  };
}

// Speichert einen Beleg aus base64-Daten (z.B. eine PDF-Rechnung aus WooCommerce-Import)
async function saveReceiptFromData(txId,fileData){
  const id='rcpt_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const record={
    id,txId,
    filename:fileData.filename||'rechnung.pdf',
    mime:fileData.mime||'application/pdf',
    size:fileData.size||0,
    data:fileData.data,
    uploadedAt:new Date().toISOString(),
  };
  await appStorage.set('receipt:'+id,JSON.stringify(record));
  return id;
}

// Berechnet Minuten zwischen zwei Uhrzeiten "HH:MM", behandelt Überschreitung über Mitternacht
function minutesBetween(from, to){
  if(!from||!to)return 0;
  const [fh,fm]=from.split(':').map(n=>parseInt(n,10));
  const [th,tm]=to.split(':').map(n=>parseInt(n,10));
  if(isNaN(fh)||isNaN(fm)||isNaN(th)||isNaN(tm))return 0;
  let mins=(th*60+tm)-(fh*60+fm);
  if(mins<0) mins+=24*60; // über Mitternacht
  return mins;
}

// Rundet Minuten auf das gewählte Raster
function roundMinutes(mins, rasterMin, mode){
  if(!rasterMin)return mins;
  const blocks=mins/rasterMin;
  let rounded;
  if(mode==='up') rounded=Math.ceil(blocks);
  else if(mode==='down') rounded=Math.floor(blocks);
  else rounded=Math.round(blocks); // 'nearest'
  return rounded*rasterMin;
}

function formatHours(mins){
  const h=mins/60;
  return h.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
}

}

function bindTimeDialog(){
  document.querySelectorAll('[data-close-time-dialog]').forEach(el=>el.addEventListener('click',closeTimeDialog));
  const raster=document.getElementById('time-raster');
  if(raster)raster.addEventListener('change',()=>{state._timeRasterMin=parseInt(raster.value,10);saveTimeFieldsAndRerender();});
  const mode=document.getElementById('time-mode');
  if(mode)mode.addEventListener('change',()=>{state._timeRoundMode=mode.value;saveTimeFieldsAndRerender();});
  document.querySelectorAll('[data-te]').forEach(el=>{
    // Nur bei change (Verlassen des Felds) neu rendern, nicht bei input — damit
    // der Fokus beim Tippen nicht verloren geht
    el.addEventListener('change',()=>{updateTimeEntryFromInput(el);renderTimeDialog();});
    // Eingabe-Werte trotzdem direkt in state schreiben, ohne Re-Render
    el.addEventListener('input',()=>{updateTimeEntryFromInput(el);});
  });
  document.querySelectorAll('[data-te-del]').forEach(el=>el.addEventListener('click',()=>{
    const i=parseInt(el.dataset.teDel,10);
    const item=state.invoiceDraft.items[state._timeItemIdx];
    if(item.timeEntries.length<=1)return;
    item.timeEntries.splice(i,1);
    renderTimeDialog();
  }));
  const addBtn=document.querySelector('[data-te-add]');
  if(addBtn)addBtn.addEventListener('click',()=>{
    saveTimeFieldsAndRerender();
    const item=state.invoiceDraft.items[state._timeItemIdx];
    // Default-Datum: letztes verwendetes Datum oder heute
    const lastDate=item.timeEntries[item.timeEntries.length-1]?.date||todayISO();
    item.timeEntries.push({date:lastDate, from:'', to:'', breakMin:0, note:''});
    renderTimeDialog();
  });
  const appendChk=document.getElementById('time-append-desc');
  if(appendChk)appendChk.addEventListener('change',()=>{state._timeAppendDesc=appendChk.checked;});
  // Apply-Action
  document.querySelectorAll('[data-action="apply-time"]').forEach(el=>el.addEventListener('click',applyTimeToItem));
}

function updateTimeEntryFromInput(el){
  const i=parseInt(el.dataset.i,10);
  const key=el.dataset.te;
  const item=state.invoiceDraft.items[state._timeItemIdx];
  if(!item.timeEntries[i])return;
  let val=el.value;
  if(key==='breakMin') val=parseInt(val,10)||0;
  item.timeEntries[i][key]=val;
}

function saveTimeFieldsAndRerender(){
  // Liest die aktuellen Werte aus den Inputs zurück in state, BEVOR neu gerendert wird
  document.querySelectorAll('[data-te]').forEach(el=>updateTimeEntryFromInput(el));
}

function closeTimeDialog(){
  document.getElementById('time-dialog-root').innerHTML='';
}

function applyTimeToItem(){
  saveTimeFieldsAndRerender();
  const idx=state._timeItemIdx;
  const item=state.invoiceDraft.items[idx];
  if(!item)return;
  const raster=state._timeRasterMin;
  const mode=state._timeRoundMode;
  let totalRounded=0;
  const lines=[];
  (item.timeEntries||[]).forEach(e=>{
    const grossMin=Math.max(0, minutesBetween(e.from, e.to)-(parseInt(e.breakMin,10)||0));
    if(grossMin<=0)return;
    const roundedMin=roundMinutes(grossMin, raster, mode);
    totalRounded+=roundedMin;
    const datePart=e.date?fmtDate(e.date):'';
    const timePart=`${e.from}–${e.to}`;
    const breakPart=(parseInt(e.breakMin,10)||0)>0?` (−${e.breakMin} min Pause)`:'';
    const notePart=e.note?` · ${e.note}`:'';
    lines.push(`${datePart} ${timePart}${breakPart}${notePart} = ${formatHours(roundedMin)} Std.`);
  });
  const totalHours=totalRounded/60;
  // Menge setzen
  item.qty=Math.round(totalHours*100)/100;
  item.unit='Std.';
  // Beschreibung anhängen wenn gewünscht
  if(state._timeAppendDesc && lines.length){
    const existing=(item.description||'').trim();
    item.description=(existing?existing+'\n\n':'')+lines.join('\n');
  }
  closeTimeDialog();
  renderInvoiceModal();
}
